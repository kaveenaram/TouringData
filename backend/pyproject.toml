[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "kaveenaram", email = "kaveenaram@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apify-client>=3.2.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-sqlalchemy>=3.1.1",
    "parse-sdk>=0.2.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "soundcharts>=1.3.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
